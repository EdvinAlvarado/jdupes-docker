services:
  jdupes:
    build: .
    container_name: jdupes
    volumes:
      - /path/to/scan:/data
      - /mnt/user/jdupes/scripts:/scripts
      - /mnt/user/jdupes/db:/db
    environment:
      SOURCE_DIR: "/data"
      JDUPES_OPTIONS: "-rMS"
      JDUPES_DB: "/db/jdupes.db"
      # WRITE_SCRIPT: "true"
      # CRON_SCHEDULE: "0 2 * * *"
      # RUN_ON_STARTUP: "true"
